name: Workbench v1.1 quality
on:
  pull_request:
  push:
    branches: [main, 'codex/v1.1-*']
permissions:
  contents: read
concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: unit (${{ matrix.timezone }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        timezone: [UTC, Asia/Shanghai, America/New_York]
    env:
      TZ: ${{ matrix.timezone }}
    defaults:
      run:
        working-directory: workbench-v8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workbench-v8/package-lock.json
      - run: npm ci
      - name: Dependency advisories
        if: matrix.timezone == 'UTC'
        run: npm audit --audit-level=moderate
      - run: npm run test:run -- --coverage
      - run: npm run build
      - name: Contracts and implementation
        working-directory: .
        run: |
          node scripts/contract-gate.mjs
          node scripts/implementation-gate.mjs
          node scripts/release-consistency.mjs
  browser:
    name: browser motivation loop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench-v8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: workbench-v8/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:web
      - run: npm run build
      - run: npm run test:e2e:production
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-validation
          retention-days: 7
          path: workbench-v8/test-results
  required:
    name: required
    if: always()
    needs: [unit, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$BROWSER_RESULT" = success
