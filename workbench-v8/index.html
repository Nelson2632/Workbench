<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workbench 1.1 RC</title>
    <style>
      /* ============================================================
         开屏（复用 MyDiary 原开屏设计：白底 + #0D6EFD 蓝框 + logo +
         装饰线 + 标题 + 副标题 + 启动文案 + 版本信息）
         仅 React mount 前显示，bootstrap 完成后淡出移除
         ============================================================ */
      :root {
        --color-bg: #ffffff;
        --color-brand: #0d6efd;
        --color-title: #212529;
        --color-sub: #6c757d;
        --color-muted: #adb5bd;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--color-bg);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial,
          sans-serif;
      }
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--color-bg);
        z-index: 9999;
      }
      .splash-frame {
        display: flex;
        flex-direction: column;
        width: 460px;
        max-width: calc(100vw - 48px);
        padding: 2px;
        border-radius: 14px;
        background: var(--color-brand);
        box-shadow: 0 8px 32px rgba(13, 110, 253, 0.14);
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 32px 28px;
        border-radius: 12px;
        background: #ffffff;
      }
      .splash-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 18px;
        display: block;
      }
      .splash-divider {
        width: 120px;
        height: 3px;
        background: var(--color-brand);
        border-radius: 2px;
        margin-bottom: 18px;
      }
      .splash-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--color-title);
        margin-bottom: 6px;
      }
      .splash-subtitle {
        font-size: 12px;
        color: var(--color-sub);
        margin-bottom: 22px;
        letter-spacing: 0.3px;
      }
      .splash-loading {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--color-brand);
      }
      .splash-dots { display: inline-flex; gap: 4px; }
      .splash-dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--color-brand);
        animation: splash-pulse 1.2s ease-in-out infinite both;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.15s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-pulse {
        0%, 80%, 100% { opacity: 0.25; transform: scale(0.7); }
        40% { opacity: 1; transform: scale(1); }
      }
      .splash-version {
        align-self: flex-end;
        padding: 8px 16px 10px;
        font-size: 11px;
        color: #ffffff;
        letter-spacing: 0.4px;
      }
    </style>
  </head>
  <body>
    <div id="app-loading">
      <div class="splash-frame">
        <div class="splash-inner">
          <svg class="splash-logo" viewBox="0 0 48 46" fill="none" aria-hidden="true">
            <path fill="#863bff" d="M25.9 44.9c-.66.85-2.02.38-2.02-.7V33.9a2.26 2.26 0 0 0-2.26-2.26H10.3c-.92 0-1.46-1.04-.92-1.79l7.48-10.47c1.07-1.5 0-3.58-1.84-3.58H1.24c-.92 0-1.46-1.04-.92-1.79L10 .47c.21-.3.56-.47.92-.47h28.9c.92 0 1.45 1.04.92 1.79L33.3 12.26c-1.07 1.5 0 3.58 1.84 3.58h11.38c.94 0 1.47 1.09.89 1.83L25.9 44.9z"/>
          </svg>
          <div class="splash-divider"></div>
          <div class="splash-title">个人工作台</div>
          <div class="splash-subtitle">Life · Work · Play — Personal OS</div>
          <div class="splash-loading">
            正在启动
            <span class="splash-dots"><span></span><span></span><span></span></span>
          </div>
        </div>
        <div class="splash-version">V9 Personal OS</div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
