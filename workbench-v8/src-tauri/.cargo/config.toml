[source.crates-io]
replace-with = 'rsproxy-sparse'

[source.rsproxy]
registry = "https://rsproxy.cn/crates.io-index"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[registries.rsproxy]
index = "https://rsproxy.cn/crates.io-index"

[net]
git-fetch-with-cli = true

# 固定使用 MSVC 原生 link.exe（完整路径），规避 Git Bash 下 /usr/bin/link (POSIX 硬链接工具)
# 抢占 MSVC link.exe 导致的 "missing operand after '@...'" 链接失败。
# 若 MSVC 升级导致版本号变化，请同步更新下方路径（可用 vswhere.exe 查询）。
[target.x86_64-pc-windows-msvc]
linker = "C:/Program Files/Microsoft Visual Studio/2022/Community/VC/Tools/MSVC/14.44.35207/bin/Hostx64/x64/link.exe"
